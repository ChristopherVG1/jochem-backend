<div class="blog-container">
  <button class="add-post-btn" (click)="showPopup = true">Voeg post toe</button>

  <div *ngIf="isLoading" class="loading-message">
    Posts worden geladen...
  </div>

  <div class="blog-cards" *ngIf="!isLoading">
    <div *ngIf="posts.length === 0" class="no-posts-message">
      Geen posts gevonden. Wees de eerste om er een toe te voegen!
    </div>

    <div class="blog-card" *ngFor="let post of paginatedPosts">
      <div class="blog-card-content">
        <h3 class="post-author">{{ post.author }}</h3>
        <h4 class="post-character">{{ post.characterName }}</h4>
        <p class="post-text">{{ post.text }}</p>
        <div class="post-timestamp">
          Gepost op: {{ post.createdAt | date: 'medium' }}
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination Controls -->
  <div class="pagination-controls" *ngIf="!isLoading && posts.length > 0">
    <button
      class="page-btn"
      (click)="previousPage()"
      [disabled]="currentPage === 1">
      Vorige
    </button>

    <button
      *ngFor="let page of pageNumbers"
      class="page-btn"
      [class.active]="page === currentPage"
      (click)="goToPage(page)">
      {{ page }}
    </button>

    <button
      class="page-btn"
      (click)="nextPage()"
      [disabled]="currentPage === totalPages">
      Volgende
    </button>
  </div>

  <!-- Popup (unchanged) -->
  <div class="blog-popup-backdrop" *ngIf="showPopup" (click)="showPopup = false"></div>
  <div class="blog-popup" *ngIf="showPopup">
    <form (submit)="addPost($event)">
      <label>
        Naam:<br>
        <input name="author" required>
      </label>
      <label>
        Karakter:<br>
        <input name="character" required>
      </label>
      <label>
        Wat je wil schrijven:<br>
        <textarea name="text" rows="3" required></textarea>
      </label>
      <div class="popup-actions">
        <button type="submit">Plaatsen</button>
        <button type="button" (click)="showPopup = false">Annuleren</button>
      </div>
    </form>
  </div>
</div>
